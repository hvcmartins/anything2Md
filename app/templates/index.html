<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anything2md</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>anything<span>2md</span></h1>
      <p class="subtitle">Drop any document — get clean Markdown</p>
    </header>

    <div id="drop-zone" class="drop-zone" role="button" tabindex="0"
         aria-label="Drop files here or click to browse">
      <div class="drop-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p>Drag &amp; drop files here<br/><span>or click to browse</span></p>
      <p class="hint">PDF · DOCX · XLSX · PPTX · HTML · CSV · JSON · images &amp; more
        <br/>Max {{ max_files }} files · {{ max_mb }} MB each</p>
      <input type="file" id="file-input" multiple hidden />
    </div>

    <div id="file-list" class="file-list hidden">
      <div class="file-list-header">
        <span id="file-count">0 / {{ max_files }} files</span>
        <div class="header-actions">
          <button id="btn-download-zip" class="btn btn-primary" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download all (.zip)
          </button>
          <button id="btn-clear" class="btn btn-ghost">Clear all</button>
        </div>
      </div>
      <ul id="items"></ul>
    </div>
  </div>

  <script>
    const MAX_FILES = {{ max_files }};
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
